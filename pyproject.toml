[project]
name = "emolabel-youtube"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "librosa>=0.11.0",
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.2,<2; sys_platform == 'linux'",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyannote-audio>=4.0.7",
    "python-dotenv>=1.2.3",
    "silero-vad>=6.2.1",
    "soundfile>=0.14.0",
    "speechbrain>=1.1.0",
    "torch>=2.4",
    "transformers>=4.44",
    "uvicorn[standard]>=0.52.4",
    "yt-dlp>=2026.8.19",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
